<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DucoWorks — Social Flyers</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/styles.css">
<style>
  .grab { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
  .grab figure { margin: 0; background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  .grab img { display: block; width: 100%; height: auto; border: 1px solid var(--line-soft); }
  .grab figcaption {
    margin-top: 12px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .grab a { display: inline-block; margin-top: 8px; }
</style>
</head>
<body>

<header class="site-head">
  <a class="brand" href="/" aria-label="DucoWorks home">
    <img class="brand-mark" src="/mark.png" alt="" width="256" height="256">
    <img class="brand-word" src="/wordmark.png" alt="DucoWorks" width="600" height="55">
  </a>
</header>

<main id="main">
  <section>
    <div class="wrap">
      <p class="num">Internal</p>
      <h2>Social Flyers</h2>
      <p class="intro">On a phone: press and hold an image, then <b>Save to Photos</b>.
        The tall ones are for Instagram feed, the square ones for Facebook.</p>

      <div class="grab">
        <figure><img src="/flyers/1-launch-ig.jpg" alt="Launch offer flyer, Instagram size">
          <figcaption>1 &middot; Launch offer &middot; Instagram 1080&times;1350</figcaption>
          <a href="/flyers/1-launch-ig.jpg">Open full size</a></figure>
        <figure><img src="/flyers/2-ceramic-ig.jpg" alt="Ceramic coating flyer, Instagram size">
          <figcaption>2 &middot; Ceramic &middot; Instagram 1080&times;1350</figcaption>
          <a href="/flyers/2-ceramic-ig.jpg">Open full size</a></figure>
        <figure><img src="/flyers/3-mobile-ig.jpg" alt="Mobile service flyer, Instagram size">
          <figcaption>3 &middot; We come to you &middot; Instagram 1080&times;1350</figcaption>
          <a href="/flyers/3-mobile-ig.jpg">Open full size</a></figure>
        <figure><img src="/flyers/4-finish-ig.jpg" alt="Brand flyer, Instagram size">
          <figcaption>4 &middot; Not just clean &middot; Instagram 1080&times;1350</figcaption>
          <a href="/flyers/4-finish-ig.jpg">Open full size</a></figure>

        <figure><img src="/flyers/1-launch-sq.jpg" alt="Launch offer flyer, square">
          <figcaption>1 &middot; Launch offer &middot; Facebook 1080&times;1080</figcaption>
          <a href="/flyers/1-launch-sq.jpg">Open full size</a></figure>
        <figure><img src="/flyers/2-ceramic-sq.jpg" alt="Ceramic coating flyer, square">
          <figcaption>2 &middot; Ceramic &middot; Facebook 1080&times;1080</figcaption>
          <a href="/flyers/2-ceramic-sq.jpg">Open full size</a></figure>
        <figure><img src="/flyers/3-mobile-sq.jpg" alt="Mobile service flyer, square">
          <figcaption>3 &middot; We come to you &middot; Facebook 1080&times;1080</figcaption>
          <a href="/flyers/3-mobile-sq.jpg">Open full size</a></figure>
        <figure><img src="/flyers/4-finish-sq.jpg" alt="Brand flyer, square">
          <figcaption>4 &middot; Not just clean &middot; Facebook 1080&times;1080</figcaption>
          <a href="/flyers/4-finish-sq.jpg">Open full size</a></figure>
      </div>
    </div>
  </section>
</main>

</body>
</html>
